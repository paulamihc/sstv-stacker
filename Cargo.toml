[workspace]
resolver = "2"
members = ["crates/stacker", "crates/cli", "crates/web"]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Paul Friend"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/paulamihc/sstv-stacker"
homepage = "https://sstvstacker.netlify.app"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The web page's WebAssembly: small, and the combining stays fast.
[profile.web]
inherits = "release"
panic = "abort"
strip = true
