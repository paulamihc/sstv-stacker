# Netlify: the page is already built (web/dist, made by web/build.sh), so
# there is nothing to build here; Netlify just publishes the folder.
[build]
  publish = "web/dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # The page loads nothing from any other site and sends nothing anywhere.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' blob: data:; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=3600"
